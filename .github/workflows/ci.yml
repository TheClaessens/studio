name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: browser-actions/setup-chrome@v2.2.0
        id: chrome
        with:
          install-dependencies: true
      # Ubuntu 24.04's AppArmor blocks the user namespaces Chrome's sandbox needs;
      # without this, pages never load and the browser tests hang.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      # `studio check` (seam 2) and the UI smoke tests skip without a browser.
      - run: npm run check
        env:
          STUDIO_BROWSER: ${{ steps.chrome.outputs.chrome-path }}

  # `#semver:` pins only resolve to tagged versions, so tag each version that lands on main.
  tag:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: |
          tag="v$(node -p "require('./package.json').version")"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && exit 0
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git tag -a "$tag" -m "Studio $tag"
          git push origin "$tag"
